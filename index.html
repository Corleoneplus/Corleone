<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050505">
<title>CORLEONE PLUS</title>

<!-- الخطوط -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Outfit:wght@300;400;600;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
    --bg-main: #050505;
    --bg-card: rgba(15, 15, 15, 0.7);
    --border-glass: rgba(255, 255, 255, 0.08);
    --gold: #d4af37;
    --gold-light: #f3e5ab;
    --text-main: #f5f5f5;
    --text-muted: #888;
    --success: #28a745;
    --danger: #dc3545;
    --font-ar: 'Tajawal', sans-serif;
    --font-en: 'Outfit', sans-serif;
    --font-brand: 'Cinzel', serif;
    --smooth: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
}

html, body {
    height: 100%;
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: var(--font-ar);
    overflow-x: hidden;
    overscroll-behavior: none;
}

/* إضاءة خلفية هادئة */
body::before {
    content: '';
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.05) 0%, transparent 40%);
    z-index: -1;
}

.hidden { display: none !important; }
.loader { display: inline-block; width: 24px; height: 24px; border: 2px solid rgba(212, 175, 55, 0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* الشريط العلوي */
header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 15px 20px; position: sticky; top: 0; z-index: 100;
    background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-glass);
}

#user-bar { display: flex; gap: 12px; align-items: center; }
.balance {
    background: linear-gradient(135deg, rgba(212,175,55,0.1), rgba(212,175,55,0.02));
    border: 1px solid rgba(212, 175, 55, 0.3);
    padding: 6px 14px; border-radius: 30px; font-size: 0.9rem; font-weight: 700;
    color: var(--gold-light); font-family: var(--font-en);
    display: flex; align-items: center; gap: 6px;
}

/* شاشة تسجيل الدخول */
#login-screen {
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    height: 100vh; padding: 20px;
}

.login-card {
    background: var(--bg-card);
    border: 1px solid var(--border-glass);
    border-radius: 28px; padding: 40px 30px; width: 100%; max-width: 400px;
    text-align: center; display: flex; flex-direction: column; align-items: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    animation: fadeIn 0.8s ease-out;
}

/* إعدادات اللوكو الفخم */
.logo-img {
    width: 130px;
    height: 130px;
    border-radius: 24px; /* حواف ناعمة */
    object-fit: cover;
    margin-bottom: 20px;
    border: 2px solid rgba(212, 175, 55, 0.4);
    box-shadow: 0 0 30px rgba(212, 175, 55, 0.15); /* إضاءة ناعمة */
    padding: 2px;
    background: #000;
}

.brand-title {
    font-family: var(--font-brand); font-size: 2rem; font-weight: 900;
    color: var(--gold); letter-spacing: 2px; margin-bottom: 8px;
}

.input-group { position: relative; margin-bottom: 24px; width: 100%; }
.input-group input {
    width: 100%; padding: 16px; background: rgba(0,0,0,0.6);
    border: 1px solid var(--border-glass); border-radius: 14px;
    color: var(--gold-light); font-size: 1.1rem; font-family: var(--font-en);
    text-align: center; letter-spacing: 2px; font-weight: 600;
    transition: var(--smooth); outline: none;
}
.input-group input:focus { border-color: var(--gold); box-shadow: 0 0 15px rgba(212, 175, 55, 0.15); }
.input-group input::placeholder { font-family: var(--font-ar); letter-spacing: normal; color: var(--text-muted); font-size: 0.95rem; }

/* الأزرار */
.btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 16px; border: none; border-radius: 14px;
    font-size: 1rem; font-weight: 700; font-family: var(--font-ar);
    cursor: pointer; transition: var(--smooth);
    background: linear-gradient(135deg, var(--gold), #b8952b);
    color: #000;
}
.btn:active { transform: scale(0.97); }
.btn.outline { background: transparent; border: 1px solid var(--border-glass); color: var(--text-main); }

/* الشاشة الرئيسية */
#main-screen { max-width: 800px; margin: 0 auto; padding: 20px 16px 80px; animation: slideUp 0.5s ease-out;}

/* التبويبات */
.tabs {
    display: flex; position: relative; background: var(--bg-card);
    border: 1px solid var(--border-glass); border-radius: 16px; padding: 6px;
    margin-bottom: 24px; backdrop-filter: blur(10px);
}
.tab-btn {
    flex: 1; padding: 12px 0; background: transparent; border: none;
    color: var(--text-muted); font-size: 0.9rem; font-weight: 600;
    cursor: pointer; transition: var(--smooth); z-index: 1;
    display: flex; align-items: center; justify-content: center; gap: 6px;
}
.tab-btn.active { color: #000; }
.tab-indicator {
    position: absolute; top: 6px; bottom: 6px; width: calc(25% - 3px);
    background: linear-gradient(135deg, var(--gold), #c59b27);
    border-radius: 12px; transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    z-index: 0;
}

.tab-content { display: none; animation: fadeIn 0.4s ease-out; }
.tab-content.active { display: block; }

/* المتجر */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
.shop-item {
    background: var(--bg-card); border: 1px solid var(--border-glass);
    border-radius: 16px; padding: 16px; cursor: pointer;
    transition: var(--smooth); position: relative;
}
.shop-item:hover { border-color: rgba(212, 175, 55, 0.4); }
.shop-item:active { transform: scale(0.96); }
.shop-item .title { font-weight: 700; font-size: 1.05rem; margin-bottom: 8px; }
.shop-item .meta { display: flex; justify-content: space-between; font-size: 0.85rem; }
.shop-item .price { color: var(--gold-light); font-family: var(--font-en); font-weight: 700; }
.shop-item .stock { color: var(--text-muted); }
.shop-item.sold { opacity: 0.5; filter: grayscale(1); cursor: not-allowed; }

/* المشتريات */
.purchase-card {
    background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: 16px;
    padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
}
.purchase-card .phone { font-family: var(--font-en); font-size: 1.1rem; font-weight: 700; color: var(--gold-light); }
.purchase-card .btn { width: auto; padding: 10px 16px; font-size: 0.85rem; }

/* الكروت */
.card {
    background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: 20px;
    padding: 24px; margin-bottom: 20px;
}
.card-title { font-size: 1.1rem; font-weight: 700; color: var(--gold); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

/* الحقول */
.form-control {
    width: 100%; padding: 14px; background: rgba(0,0,0,0.5);
    border: 1px solid var(--border-glass); border-radius: 12px;
    color: var(--text-main); font-size: 0.95rem; font-family: var(--font-ar);
    outline: none; margin-bottom: 12px;
}
.form-control:focus { border-color: var(--gold); }

/* المودال */
.modal {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.9); backdrop-filter: blur(5px);
    display: flex; justify-content: center; align-items: center; z-index: 1000;
    padding: 20px; opacity: 0; pointer-events: none; transition: var(--smooth);
}
.modal.show { opacity: 1; pointer-events: auto; }
.modal-content {
    background: #0f0f0f; border: 1px solid rgba(212,175,55,0.3); border-radius: 20px;
    width: 100%; max-width: 400px; padding: 24px;
    transform: scale(0.9); transition: var(--smooth);
}
.modal.show .modal-content { transform: scale(1); }

/* الإشعارات */
.toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: #333; color: #fff; padding: 12px 24px; border-radius: 30px;
    font-weight: 700; font-size: 0.9rem; opacity: 0; transition: var(--smooth); z-index: 2000;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.error { background: var(--danger); }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 600px) {
    .brand-title { font-size: 1.6rem; }
    .tab-btn { font-size: 0.75rem; flex-direction: column; padding: 10px 0; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    .purchase-card { flex-direction: column; align-items: flex-start; gap: 12px; }
    .purchase-card .btn { width: 100%; }
}
</style>
</head>
<body>

<header>
    <!-- تم إزالة اللوكو من هنا ونقله للشاشة الرئيسية ليصبح كبيراً وواضحاً -->
    <h1 style="font-family:var(--font-brand); color:var(--gold); font-size:1.2rem; letter-spacing:1px;">CORLEONE PLUS</h1>
    
    <div id="user-bar" class="hidden">
        <div class="balance">💰 <span id="user-balance">0.00</span>$</div>
        <button id="logout-btn" class="btn outline" style="width:auto; padding:8px 12px; font-size:0.8rem;">خروج</button>
    </div>
</header>

<!-- الدخول -->
<div id="login-screen">
    <div class="login-card">
        <!-- اللوكو الآن كبير، بحواف ناعمة وإضاءة خفيفة -->
        <img src="logo.png" alt="CORLEONE PLUS" class="logo-img" onerror="this.style.display='none';">
        
        <div class="brand-title">CORLEONE PLUS</div>
        <div style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px;">أدخل كلمة المرور الخاصة بك</div>
        
        <div class="input-group">
            <!-- الخانة فاضية، والنوع password عشان يخفي الحروف -->
            <input type="password" id="login-password" placeholder="أدخل كلمة المرور هنا" autocomplete="off" spellcheck="false">
        </div>
        <button id="login-btn" class="btn">دخول</button>
    </div>
</div>

<!-- الرئيسية -->
<div id="main-screen" class="hidden">
    
    <div class="tabs">
        <div class="tab-indicator" id="tab-indicator"></div>
        <button class="tab-btn active" data-tab="shop" onclick="switchTab(0, 'shop')">🛍️ المتجر</button>
        <button class="tab-btn" data-tab="purchases" onclick="switchTab(1, 'purchases')">📦 مشترياتي</button>
        <button class="tab-btn" data-tab="recharge" onclick="switchTab(2, 'recharge')">💳 شحن</button>
        <button class="tab-btn" data-tab="support" onclick="switchTab(3, 'support')">🆘 الدعم</button>
    </div>

    <!-- المتجر -->
    <div id="tab-shop" class="tab-content active">
        <div id="breadcrumb" class="hidden" style="margin-bottom: 15px; font-size: 0.9rem;">
            <span style="color: var(--gold); cursor: pointer;" onclick="loadShop(null)">الرئيسية</span> / <span id="bc-current"></span>
        </div>
        <div id="shop-grid" class="grid">
            <div style="grid-column: 1/-1; text-align: center; padding: 40px;"><div class="loader"></div></div>
        </div>
    </div>

    <!-- المشتريات -->
    <div id="tab-purchases" class="tab-content">
        <div id="purchases-list"></div>
    </div>

    <!-- الشحن -->
    <div id="tab-recharge" class="tab-content">
        <div class="card">
            <div class="card-title">🪙 شحن بالكريبتو</div>
            <select id="crypto-asset" class="form-control">
                <option value="TON">TON</option>
                <option value="USDT">USDT</option>
            </select>
            <input type="number" id="crypto-amount" class="form-control" placeholder="المبلغ بالدولار" min="1" step="0.5">
            <button id="crypto-create" class="btn">إنشاء فاتورة</button>
            <div id="crypto-result" class="hidden" style="margin-top: 15px;"></div>
        </div>

        <div class="card">
            <div class="card-title">📱 شحن آسيا سيل</div>
            <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px;">كل 1000 دينار = <span id="asia-price">0.60</span>$</div>
            <input type="tel" id="asia-phone" class="form-control" placeholder="رقم الآسيا (مثال: 07701234567)">
            <button id="asia-start" class="btn">بدء الشحن</button>
            
            <div id="asia-steps" class="hidden">
                <div id="asia-step-otp" class="hidden" style="margin-top: 15px;">
                    <input type="text" id="asia-otp" class="form-control" placeholder="كود التحقق">
                    <button id="asia-otp-submit" class="btn outline">تأكيد الكود</button>
                </div>
                <div id="asia-step-amount" class="hidden" style="margin-top: 15px;">
                    <input type="number" id="asia-amount" class="form-control" placeholder="المبلغ بالدينار (حد أدنى 1000)">
                    <button id="asia-amount-submit" class="btn outline">متابعة</button>
                </div>
                <div id="asia-step-confirm" class="hidden" style="margin-top: 15px;">
                    <p id="asia-confirm-info" style="font-size: 0.9rem; margin-bottom: 10px; color: var(--text-muted);"></p>
                    <input type="text" id="asia-confirm" class="form-control" placeholder="كود تأكيد التحويل">
                    <button id="asia-confirm-submit" class="btn" style="background: var(--success); color: white;">تأكيد نهائي</button>
                </div>
            </div>
            <div id="asia-msg" class="hidden" style="margin-top: 15px; font-size: 0.9rem;"></div>
        </div>
    </div>

    <!-- الدعم -->
    <div id="tab-support" class="tab-content">
        <div class="card" style="text-align: center;">
            <div class="card-title" style="justify-content: center;">🆘 الدعم الفني</div>
            <div style="display: flex; gap: 10px; flex-direction: column; margin-top: 20px;">
                <a href="https://t.me/Z_5_F6" target="_blank" class="btn outline" style="text-decoration: none;">@Z_5_F6</a>
                <a href="https://t.me/nhnhhnhn" target="_blank" class="btn outline" style="text-decoration: none;">@nhnhhnhn</a>
            </div>
        </div>
    </div>

</div>

<!-- المودال -->
<div id="chat-modal" class="modal">
    <div class="modal-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div style="font-weight: 700; color: var(--gold);" id="chat-title">🔑 الكود</div>
            <button onclick="closeChat()" style="background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer;">✖</button>
        </div>
        <div id="chat-body" style="max-height: 300px; overflow-y: auto; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center; min-height: 100px;"></div>
        <button id="chat-request-otp" class="btn">🔄 طلب كود OTP</button>
    </div>
</div>

<!-- إشعارات -->
<div id="toast" class="toast"></div>

<script>
const API_BASE = "https://corleonestore.wisp.uno";

const state = {
  token: localStorage.getItem("token") || null,
  user: null,
  currentParent: null,
  chatNumberId: null
};

function showToast(msg, type = "success") {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = `toast show ${type}`;
    setTimeout(() => { t.classList.remove("show"); }, 3000);
}

async function api(path, method = "GET", body = null) {
    const headers = { "Content-Type": "application/json" };
    if (state.token) headers["Authorization"] = "Bearer " + state.token;
    
    try {
        const res = await fetch(API_BASE + path, { method, headers, body: body ? JSON.stringify(body) : null });
        const data = await res.json().catch(() => ({}));
        if (res.status === 401 && path !== "/api/login") {
            localStorage.removeItem("token");
            location.reload();
            throw new Error("انتهت الجلسة");
        }
        if (!res.ok) throw new Error(data.detail || "حدث خطأ");
        return data;
    } catch (err) {
        throw new Error("لا يمكن الاتصال بالخادم، تأكد من تشغيل البوت (Wispbyte)");
    }
}

function switchTab(index, tabName) {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
    
    document.querySelector(`[data-tab="${tabName}"]`).classList.add("active");
    document.getElementById(`tab-${tabName}`).classList.add("active");
    
    const indicator = document.getElementById("tab-indicator");
    indicator.style.transform = `translateX(${index * 100}%)`;
    
    if (tabName === "purchases") loadPurchases();
}

async function initApp() {
    try {
        const cfg = await api("/api/config");
        document.getElementById("asia-price").textContent = cfg.asia_price_per_1000.toFixed(2);
    } catch (e) {}

    if (state.token) {
        try {
            state.user = await api("/api/me");
            document.getElementById("user-balance").textContent = state.user.balance.toFixed(2);
            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("main-screen").classList.remove("hidden");
            document.getElementById("user-bar").classList.remove("hidden");
            loadShop(null);
        } catch (e) {
            localStorage.removeItem("token");
        }
    }
}

// تسجيل الدخول
document.getElementById("login-btn").onclick = async () => {
    const pwd = document.getElementById("login-password").value.trim();
    if (!pwd) return showToast("أدخل كلمة السر", "error");
    const btn = document.getElementById("login-btn");
    btn.innerHTML = '<div class="loader"></div>';
    try {
        const res = await api("/api/login", "POST", { password: pwd });
        state.token = res.token; state.user = res.user;
        localStorage.setItem("token", res.token);
        initApp();
    } catch (e) {
        showToast(e.message, "error");
        btn.innerHTML = 'دخول';
    }
};

document.getElementById("logout-btn").onclick = () => {
    localStorage.removeItem("token");
    location.reload();
};

// المتجر
async function loadShop(parentId) {
    const grid = document.getElementById("shop-grid");
    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px;"><div class="loader"></div></div>';
    
    const bc = document.getElementById("breadcrumb");
    if (!parentId) bc.classList.add("hidden"); else bc.classList.remove("hidden");

    try {
        const url = "/api/shop" + (parentId ? "?parent=" + parentId : "");
        const res = await api(url);
        state.currentParent = parentId;

        if (res.parent) document.getElementById("bc-current").textContent = res.parent.title;

        if (res.items.length === 0) {
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">لا توجد عناصر</div>';
            return;
        }

        grid.innerHTML = "";
        res.items.forEach(item => {
            const div = document.createElement("div");
            div.className = "shop-item" + (item.type === "category" && item.stock <= 0 ? " sold" : "");
            div.innerHTML = `
                <div class="title">${item.emoji || ""} ${item.title}</div>
                ${item.type === "category" ? `
                    <div class="meta">
                        <span class="price">${item.price.toFixed(2)}$</span>
                        <span class="stock">${item.stock > 0 ? "متوفر: " + item.stock : "نفذ"}</span>
                    </div>
                ` : `<div style="font-size:0.8rem; color:var(--text-muted);">مجلد</div>`}
            `;
            div.onclick = () => {
                if (item.type === "category") {
                    if (item.stock > 0) buyNumber(item);
                    else showToast("نفدت الكمية", "error");
                } else loadShop(item.id);
            };
            grid.appendChild(div);
        });
    } catch (e) {
        grid.innerHTML = `<div style="grid-column: 1/-1; color: var(--danger); text-align: center; padding: 20px;">${e.message}</div>`;
    }
}

async function buyNumber(item) {
    if (!confirm(`هل تريد شراء ${item.title} بـ ${item.price}$؟`)) return;
    try {
        const res = await api("/api/buy", "POST", { node_id: item.id });
        state.user.balance = res.new_balance;
        document.getElementById("user-balance").textContent = res.new_balance.toFixed(2);
        showToast("تم الشراء بنجاح");
        loadShop(state.currentParent);
    } catch (e) {
        showToast(e.message, "error");
    }
}

// المشتريات
async function loadPurchases() {
    const list = document.getElementById("purchases-list");
    list.innerHTML = '<div style="text-align: center; padding: 40px;"><div class="loader"></div></div>';
    try {
        const res = await api("/api/purchases");
        if (res.items.length === 0) {
            list.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 40px;">لا توجد مشتريات</div>';
            return;
        }
        list.innerHTML = "";
        res.items.forEach(p => {
            const div = document.createElement("div");
            div.className = "purchase-card";
            div.innerHTML = `
                <div>
                    <div class="phone">${p.phone}</div>
                    <div style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">${p.country} - ${p.price.toFixed(2)}$</div>
                </div>
                <button class="btn" onclick="openChat(${p.number_id})">📩 الكود</button>
            `;
            list.appendChild(div);
        });
    } catch (e) {
        list.innerHTML = `<div style="color: var(--danger); text-align: center; padding: 20px;">${e.message}</div>`;
    }
}

// المودال (OTP)
function openChat(numberId) {
    state.chatNumberId = numberId;
    document.getElementById("chat-body").innerHTML = "";
    document.getElementById("chat-modal").classList.add("show");
}
function closeChat() {
    document.getElementById("chat-modal").classList.remove("show");
    state.chatNumberId = null;
}

document.getElementById("chat-request-otp").onclick = async () => {
    if (!state.chatNumberId) return;
    const body = document.getElementById("chat-body");
    body.innerHTML = '<div class="loader"></div>';
    try {
        const res = await api("/api/otp/" + state.chatNumberId, "POST");
        if (res.code) {
            body.innerHTML = `<div style="font-size: 1.8rem; font-weight: 700; color: var(--success); letter-spacing: 3px;">${res.code}</div>`;
        } else {
            body.innerHTML = `<div style="color: var(--danger); text-align: center;">${res.error}</div>`;
        }
    } catch (e) {
        body.innerHTML = `<div style="color: var(--danger); text-align: center;">${e.message}</div>`;
    }
};

// الشحن (كريبتو وآسيا)
document.getElementById("crypto-create").onclick = async () => {
    const amount = parseFloat(document.getElementById("crypto-amount").value);
    const asset = document.getElementById("crypto-asset").value;
    if (!amount) return showToast("أدخل المبلغ", "error");
    const resDiv = document.getElementById("crypto-result");
    resDiv.classList.remove("hidden");
    resDiv.innerHTML = '<div class="loader" style="margin:0 auto;"></div>';
    try {
        const res = await api("/api/crypto/create", "POST", { amount, asset });
        resDiv.innerHTML = `<a href="${res.pay_url}" target="_blank" class="btn" style="text-decoration:none;">💳 ادفع الآن</a>`;
    } catch (e) {
        resDiv.innerHTML = `<div style="color:var(--danger);">${e.message}</div>`;
    }
};

document.getElementById("asia-start").onclick = async () => {
    const phone = document.getElementById("asia-phone").value;
    if (!phone) return showToast("أدخل الرقم", "error");
    const msg = document.getElementById("asia-msg");
    msg.classList.remove("hidden");
    msg.innerHTML = '<div class="loader"></div>';
    try {
        await api("/api/asia/start", { phone });
        msg.innerHTML = "تم إرسال الكود";
        document.getElementById("asia-steps").classList.remove("hidden");
        document.getElementById("asia-step-otp").classList.remove("hidden");
    } catch (e) {
        msg.innerHTML = `<span style="color:var(--danger);">${e.message}</span>`;
    }
};

document.getElementById("asia-otp-submit").onclick = async () => {
    const code = document.getElementById("asia-otp").value;
    try {
        await api("/api/asia/otp", { code });
        document.getElementById("asia-step-otp").classList.add("hidden");
        document.getElementById("asia-step-amount").classList.remove("hidden");
    } catch (e) { showToast(e.message, "error"); }
};

document.getElementById("asia-amount-submit").onclick = async () => {
    const amount = parseInt(document.getElementById("asia-amount").value);
    try {
        const res = await api("/api/asia/amount", { amount });
        document.getElementById("asia-confirm-info").innerHTML = `حول إلى: ${res.receiver} <br> سيضاف: ${res.credit_usd}$`;
        document.getElementById("asia-step-amount").classList.add("hidden");
        document.getElementById("asia-step-confirm").classList.remove("hidden");
    } catch (e) { showToast(e.message, "error"); }
};

document.getElementById("asia-confirm-submit").onclick = async () => {
    const code = document.getElementById("asia-confirm").value;
    try {
        const res = await api("/api/asia/confirm", { code });
        showToast("تم الشحن بنجاح");
        document.getElementById("user-balance").textContent = res.new_balance.toFixed(2);
        document.getElementById("asia-steps").classList.add("hidden");
        document.getElementById("asia-msg").classList.add("hidden");
    } catch (e) { showToast(e.message, "error"); }
};

initApp();
</script>
</body>
</html>
